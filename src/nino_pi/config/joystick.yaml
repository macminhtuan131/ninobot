teleop_twist_joy_node:
  ros__parameters:
    use_sim_time: false
    publish_stamped_twist: false
    require_enable_button: true
    enable_button: 4  # LB; confirm your controller using ros2 topic echo /joy
    enable_turbo_button: -1
    axis_linear: {x: 1}
    scale_linear: {x: 0.2}
    axis_angular: {yaw: 0}
    scale_angular: {yaw: 0.6}

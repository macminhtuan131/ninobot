# NEW research contract; not a legacy train.py/300D torque checkpoint config.
experiment_contract: nino_residual_velocity_v1
algorithm: TD3
control_interval_s: 0.1
actor:
  history_frames: 5
  max_history_gap_s: 0.15
  privileged_inputs: []
  feature_schema: nino_control.residual_velocity.FEATURES
  normalization: fixed_physical_proposals_export_with_checkpoint
nominal_geometry: {radius_l: 0.060, radius_r: 0.060, separation: 0.345}
# Simulation engineering proposals; none are hardware-accepted limits.
reference_limits:
  separation_m: 0.345
  wheel_speed_m_s: 0.4
  forward_m_s: 0.4
  yaw_rad_s: 0.5
  wheel_acceleration_m_s2: 0.1
  residual_wheel_m_s: 0.04
  max_age_s: 0.2
simulation_authority: 0.0
hardware_authority: 0.0
reward_weights: {progress_m: 10.0, heading_rad: 0.5, lateral_m: 0.5, vibration_proxy: 0.01, time: 0.01, action_size: 0.01, action_change: 0.001}
exploration_sigma: 0.1
algorithm_parameters:
  TD3: {learning_rate: 0.0003, buffer_size: 100000, learning_starts: 1000, batch_size: 256, tau: 0.005, gamma: 0.99, train_freq: 1, gradient_steps: 1, policy_delay: 2, target_policy_noise: 0.2, target_noise_clip: 0.5}
training: {allowed: false, backend_validation_artifact: null, budget_transitions: null}
evaluation:
  baseline: [B0_velocity_backend_same_ramp, B1_classical_yaw_feedback, PPO_same_contract]
  primary: task_tracking_quality_pareto_with_time_constraints
  grouped_splits: [run, layout, session, payload_block]
  failures_retained: true
  train_seed_count: null
  final_test_budget: null
  minimum_effect_accepted: null

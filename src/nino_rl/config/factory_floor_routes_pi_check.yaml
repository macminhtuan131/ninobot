# Drawn-route PI checks only: no PPO transfer or new training is authorized here.
extends: factory_floor_pi_check.yaml
# Existing route API uses three actions; baseline supplies full speed and ZERO
# learned torque residuals. Steering comes from route_command and wheel PI.
action_mode: wheel_torque
evaluation_baseline: true
reward_v2:
  progress_metric: path
routes:
  enabled: true
  revision: factory_four_drawn_routes_v1
  selection: balanced_shuffle
  projection_forward_m: 0.8
  projection_backward_m: 0.5
  gate_spacing_m: 1.0
  gate_radius_m: 0.6
  steering_lookahead_m: 0.45
  max_yaw_rate_rad_s: 0.8
  turn_speed_m_s: 0.12
  target_seconds_per_m: 5.0
  target_slack_seconds: 15.0
  deadline_slack_seconds: 40.0
  definitions:
  - id: E1
    goal_heading_deg: 0.0
    waypoints: [[0.0, 0.0], [6.45, 0.0]]
  - id: N1
    goal_heading_deg: 90.0
    waypoints: [[0.0, 0.0], [3.20, 0.0], [3.20, 2.75]]
  - id: S1
    goal_heading_deg: -90.0
    waypoints: [[0.0, 0.0], [3.20, 0.0], [3.20, -2.75]]
  - id: W1
    goal_heading_deg: 180.0
    # Upper pass across the course, clockwise turn beyond the last cable,
    # lower return pass and final westward segment into W1.
    waypoints:
    - [0.0, 0.0]
    - [0.30, 0.50]
    - [0.80, 1.10]
    - [1.70, 1.45]
    - [3.00, 1.60]
    - [4.50, 1.60]
    - [5.70, 1.45]
    - [6.35, 1.00]
    - [6.70, 0.35]
    - [6.70, -0.65]
    - [6.30, -1.25]
    - [5.50, -1.55]
    - [4.00, -1.65]
    - [2.50, -1.65]
    - [1.10, -1.40]
    - [0.10, -0.90]
    - [-0.35, -0.35]
    - [-0.55, 0.0]
    - [-1.00, 0.0]
research_map:
  revision: factory_floor_contact_v6_drawn_routes_v1
  stage: route_PI_feasibility
  training_allowed: false
  optuna_allowed: false

# Research specification, consumed by prepare_flat_reactive_research.py.
# Not a legacy train.py config. No old checkpoint or coordinate schedule transfer.
revision: flat_proprioceptive_v1
primary_course: combined_flat_section
rough_scope: deferred_out_of_distribution
phase: A_single_obstacle_mechanism
source_bundle: rl_runs/flat_command_clock_check_v2
control:
  interval_seconds: 0.1
  physics_step_seconds: 0.001
  minimum_speed_scale: 0.55
  maximum_speed_scale: 1.0
  scale_rate_per_second: 0.4
  steering: existing_flat_path_follower_and_wheel_PI
reactive_reference:
  # Screening starting values, not tuned or validated on flat.
  target_scale: 0.70
  hold_seconds: 0.80
  cooldown_seconds: 1.20
  startup_seconds: 0.80
  acceleration_tau_seconds: 0.15
  acceleration_threshold_m_s2: 1.50
  body_rate_threshold_rad_s: 0.35
  wheel_error_threshold_m_s: 0.06
  minimum_command_m_s: 0.15
  wheel_radius_m: 0.0625
  wheel_separation_m: 0.34273666
actor:
  history_frames: 5
  inputs: imu_and_encoders_plus_requested_and_executed_commands
  excluded: [absolute_pose, goal_distance, path_progress, elapsed_time,
             obstacle_coordinates, terrain_preview, contact_forces,
             ground_truth_velocity, caster_joint_state, lidar_ranges]
  policy_choice: pending_reactive_authority_screen
  initialization: fresh_actor_critic_optimizer
scenarios:
  # Radius is half height: horizontal rigid cylinder rests at z=radius.
  geometry: rigid_circular_cylinder
  position_range_m: [1.50, 4.90]
  minimum_center_spacing_m: 0.55
  angle_range_deg: [-30.0, 30.0]
  training_radii_m: [0.006, 0.008, 0.010]
  heldout_radii_m: [0.007, 0.009, 0.012]
  seeds: {train: 71000, validation: 72000, test: 73000}
  scenarios_per_split: {train: 48, validation: 12, test: 24}
  stage_counts: {A: [1, 1], B: [1, 6]}
screen:
  # Development scenarios only; final test bank remains reserved.
  train_scenario_indices: [0, 1, 2]
  repetitions: 2
  profiles: [full, reactive]
  simulator_profiles: [original, caster_damping_candidate]
  cold_start_each_episode: true
  max_mean_time_seconds: 18.5
  tracking_ratio_to_full: 1.05
  final_minimum_quality_gain: 0.10
  final_maximum_other_quality_ratio: 1.00
  quality_threshold_status: retained_engineering_targets_not_application_validated
  time_matched_PI: required_before_policy_quality_claim
  physical_arrival_tolerance_m: 0.20
training:
  allowed: false
  next_pilot_steps: 20480
  optuna_allowed: false
  release_condition: repeatable_physics_and_measured_reactive_authority
